<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Профиль — E'Magios Core</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="profile">
  <div class="page-with-sidebar">
    <!-- Sidebar will be injected here by common.js -->

    <main class="main-content">
      <div class="container">
        <h1>Профиль</h1>
        <p class="text-muted">Управление аккаунтом и персональными данными</p>

        <div class="auth-status">
          <div id="auth-status">
            <p class="text-muted">Проверка статуса авторизации...</p>
          </div>
        </div>

        <section id="profile-content" class="form-section">
          <div class="profile-header">
            <div id="profile-avatar-preview" class="profile-avatar-circle">
              <span class="text-muted" style="font-size:0.8rem;">Нет аватара</span>
            </div>
            <div class="profile-header-info">
              <h2 id="profile-display-name">Без имени</h2>
              <p class="text-muted" id="profile-display-email"></p>
            </div>
          </div>

          <div class="form-grid-2" style="margin-top: var(--spacing-lg);">
            <div class="form-group">
              <label for="profile-name">Отображаемое имя</label>
              <input type="text" id="profile-name" placeholder="Имя, которое будет видно в интерфейсе">
            </div>
            <div class="form-group">
              <label for="profile-email">Email</label>
              <input type="text" id="profile-email" readonly>
            </div>
          </div>

          <div style="margin-top: var(--spacing-lg); display:flex; gap: var(--spacing-sm); align-items: center;">
            <button type="button" class="btn btn-primary" id="profile-save-btn">Сохранить</button>
            <button type="button" class="btn btn-primary" id="profile-reset-btn">Сбросить изменения</button>
            <button type="button" class="btn btn-primary" id="profile-logout-btn">Выйти</button>
          </div>
          <p id="profile-status" class="text-muted" style="margin-top: 0.5rem;"></p>
        </section>
      </div>
    </main>
  </div>

  <!-- Scroll to top button -->
  <button id="scroll-to-top" class="scroll-to-top" aria-label="Наверх">↑</button>

  <script src="common.js?v=1.3"></script>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <script src="auth.js?v=1.2"></script>
  <script src="profile.js?v=1.0"></script>
</body>
</html>
