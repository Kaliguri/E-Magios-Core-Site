name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build web app
        working-directory: apps/web
        run: npm run build

      - name: Copy archived legacy site into build
        run: |
          # Legacy static site lives under legacy/ and is self-contained for its
          # content dirs. Its data/ and reports/ references resolve to ../data and
          # ../reports, which the React build already emits at the dist-react root
          # (from apps/web/public/), so no extra copy is needed.
          mkdir -p dist-react/legacy
          cp -r legacy/. dist-react/legacy/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-react

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
